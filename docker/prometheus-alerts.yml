groups:
  - name: aegis-api-alerts
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: sum(rate(http_requests_received_total{job="aegis-api",code=~"5.."}[5m])) / sum(rate(http_requests_received_total{job="aegis-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      # High Latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="aegis-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }}"

      # API Down
      - alert: APIDown
        expr: up{job="aegis-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AEGIS API is down"
          description: "AEGIS API has been unreachable for more than 1 minute"

  - name: aegis-query-alerts
    rules:
      # High Query Error Rate
      - alert: HighQueryErrorRate
        expr: sum(rate(aegis_queries_total{status="failure"}[5m])) / sum(rate(aegis_queries_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High query error rate"
          description: "Query error rate is {{ $value | humanizePercentage }}"

      # Slow Queries
      - alert: SlowQueries
        expr: histogram_quantile(0.95, sum(rate(aegis_query_duration_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries detected"
          description: "P95 query latency is {{ $value | humanizeDuration }}"

      # Too Many Active Queries
      - alert: TooManyActiveQueries
        expr: aegis_active_queries > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many active queries"
          description: "There are {{ $value }} active queries"

  - name: aegis-llm-alerts
    rules:
      # LLM High Error Rate
      - alert: LLMHighErrorRate
        expr: sum(rate(aegis_llm_requests_total{status="failure"}[5m])) / sum(rate(aegis_llm_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High LLM error rate"
          description: "LLM error rate is {{ $value | humanizePercentage }}"

      # LLM High Latency
      - alert: LLMHighLatency
        expr: histogram_quantile(0.95, sum(rate(aegis_llm_latency_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High LLM latency"
          description: "P95 LLM latency is {{ $value | humanizeDuration }}"

      # High Token Usage
      - alert: HighTokenUsage
        expr: sum(increase(aegis_llm_tokens_total[1h])) > 100000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High token usage"
          description: "{{ $value }} tokens used in the last hour"

  - name: aegis-cache-alerts
    rules:
      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: sum(rate(aegis_cache_hits_total[5m])) / (sum(rate(aegis_cache_hits_total[5m])) + sum(rate(aegis_cache_misses_total[5m]))) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

  - name: aegis-auth-alerts
    rules:
      # High Auth Failure Rate
      - alert: HighAuthFailureRate
        expr: sum(rate(aegis_auth_failures_total[5m])) / sum(rate(aegis_auth_attempts_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "Auth failure rate is {{ $value | humanizePercentage }}"

      # Brute Force Detection
      - alert: PossibleBruteForce
        expr: sum(rate(aegis_auth_failures_total[1m])) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Possible brute force attack"
          description: "{{ $value }} authentication failures per second"

  - name: aegis-system-alerts
    rules:
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: process_working_set_bytes{job="aegis-api"} / 1024 / 1024 / 1024 > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize }} GB"

      # High GC Pressure
      - alert: HighGCPressure
        expr: rate(dotnet_gc_collections_total{job="aegis-api",generation="2"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High GC pressure"
          description: "Gen2 GC rate is {{ $value }} collections/sec"

  - name: aegis-document-alerts
    rules:
      # Document Ingestion Failures
      - alert: HighDocumentFailureRate
        expr: sum(rate(aegis_documents_failed_total[5m])) / sum(rate(aegis_documents_ingested_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High document ingestion failure rate"
          description: "Document failure rate is {{ $value | humanizePercentage }}"
