name: aegis

services:
  # =============================================================================
  # CORE SERVICES (always started)
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg18
    container_name: aegis-postgres
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis-network

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: aegis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis-network

  neo4j:
    image: neo4j:5.26
    container_name: aegis-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP (Browser UI)
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - aegis-network

  # =============================================================================
  # AEGIS API
  # Includes Hangfire dashboard at /hangfire (configurable via HANGFIRE_DASHBOARD_PATH)
  # =============================================================================

  aegis-api:
    build:
      context: ..
      dockerfile: src/Aegis.Api/Dockerfile
    container_name: aegis-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aegis};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Neo4j__Uri: "bolt://neo4j:7687"
      Neo4j__Username: "neo4j"
      Neo4j__Password: "${NEO4J_PASSWORD:-password}"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6333"
      OpenTelemetry__OtlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      Jwt__Secret: "${JWT_SECRET:-your-super-secret-key-minimum-32-characters-long!}"
      Jwt__Issuer: "${JWT_ISSUER:-aegis-api}"
      Jwt__Audience: "${JWT_AUDIENCE:-aegis-client}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      Cohere__ApiKey: "${COHERE_API_KEY:-}"
      # Hangfire Background Jobs
      Hangfire__DashboardPath: "${HANGFIRE_DASHBOARD_PATH:-/hangfire}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - aegis-network
    restart: unless-stopped

  # =============================================================================
  # FULL PROFILE SERVICES
  # =============================================================================

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: aegis-elasticsearch
    profiles: ["full"]
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: aegis-rabbitmq
    profiles: ["full"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    profiles: ["full"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # =============================================================================
  # OLLAMA (Local LLM)
  # =============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: aegis-ollama
    profiles: ["full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: aegis-ollama-gpu
    profiles: ["gpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # =============================================================================
  # OBSERVABILITY STACK
  # =============================================================================

  seq:
    image: datalust/seq:latest
    container_name: aegis-seq
    profiles: ["observability"]
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: Y
    volumes:
      - seq_data:/data
    networks:
      - aegis-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aegis-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - aegis-network

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts/aegis-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - aegis-network

  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aegis-network

  # =============================================================================
  # AEGIS WEB FRONTEND
  # Vue 3 + TailwindCSS frontend (Sprint 51-52)
  # =============================================================================

  aegis-web:
    build:
      context: ../src/Aegis.Web
      dockerfile: Dockerfile
    container_name: aegis-web
    ports:
      - "${WEB_PORT:-3001}:80"
    environment:
      VITE_API_URL: "/api"
      VITE_SIGNALR_URL: "/hubs"
    depends_on:
      aegis-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - aegis-network
    restart: unless-stopped

networks:
  aegis-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  elasticsearch_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
  seq_data:
  prometheus_data:
  grafana_data:
