apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-api
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-api-role
  namespace: aegis
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-api-rolebinding
  namespace: aegis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-api-role
subjects:
  - kind: ServiceAccount
    name: aegis-api
    namespace: aegis
