apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Database password (replace with actual secret in production)
  ConnectionStrings__DefaultConnection__Password: "CHANGE_ME_IN_PRODUCTION"

  # JWT Secret for authentication
  Jwt__Secret: "CHANGE_ME_SUPER_SECRET_KEY_MIN_32_CHARS"

  # API Keys for external services
  OpenAI__ApiKey: ""
  Azure__ApiKey: ""

  # Admin credentials
  Admin__DefaultPassword: "CHANGE_ME_ADMIN_PASSWORD"
