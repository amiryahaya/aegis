name: E2E Tests

on:
  # Only run on PRs to main (not develop - saves resources)
  pull_request:
    branches: [main]
    paths:
      - 'src/Aegis.Web/**'
      - 'src/Aegis.Api/**'
      - '.github/workflows/e2e.yml'

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '9.0.x'

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJson('["chromium", "firefox", "webkit"]') || fromJson(format('["{0}"]', github.event.inputs.browser || 'chromium')) }}

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # BACKEND SETUP
      # ============================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Backend
        run: dotnet build src/Aegis.Api --configuration Release

      - name: Start Backend API
        run: |
          dotnet run --project src/Aegis.Api --configuration Release &
          echo "Waiting for API to start..."
          sleep 10
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=aegis_test;Username=postgres;Password=postgres"

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/health > /dev/null; then
              echo "API is ready!"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API failed to start"
          exit 1

      # ============================================
      # FRONTEND SETUP
      # ============================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Aegis.Web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/Aegis.Web
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('src/Aegis.Web/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/Aegis.Web
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/Aegis.Web
        run: npx playwright install-deps ${{ matrix.browser }}

      # ============================================
      # RUN E2E TESTS
      # ============================================

      - name: Build Frontend
        working-directory: src/Aegis.Web
        run: npm run build

      - name: Run E2E Tests
        working-directory: src/Aegis.Web
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5000

      # ============================================
      # UPLOAD ARTIFACTS
      # ============================================

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: src/Aegis.Web/playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: src/Aegis.Web/test-results/
          retention-days: 7

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.browser }}
          path: src/Aegis.Web/test-results/**/*.png
          retention-days: 7

  # ============================================
  # MERGE REPORTS
  # ============================================

  merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: all-reports/

      - name: Summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for dir in all-reports/*/; do
            browser=$(basename "$dir" | sed 's/playwright-report-//')
            echo "### $browser" >> $GITHUB_STEP_SUMMARY
            if [ -f "$dir/index.html" ]; then
              echo "Report generated successfully" >> $GITHUB_STEP_SUMMARY
            else
              echo "No report found" >> $GITHUB_STEP_SUMMARY
            fi
          done
